<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play HTML5 Games - Akram Albayhaqi's Portfolio">
    <title>Games - Akram Albayhaqi Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" media="print" onload="this.media='all'">
    <style>
        .game-container {
            width: 100%;
            height: 120vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            padding: 2rem;
        }

        .game-frame {
            width: 100%;
            max-width: 1280px;
            height: 720px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(var(--primary-color-rgb), 0.2);
        }

        .game-header {
            width: 100%;
            max-width: 1280px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .game-title {
            color: var(--primary-color);
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(var(--primary-color-rgb), 0.3);
        }

        .back-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .back-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            transform: translateX(-5px);
        }

        .back-btn i {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <main class="game-container">
        <div class="game-header">
            <h1 class="game-title" id="game-title">Game Title</h1>
            <a href="index.html" class="back-btn" aria-label="Back to Portfolio"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
        </div>
        <iframe id="game-frame" class="game-frame" title="Game Frame" loading="lazy" allowfullscreen></iframe>
    </main>

    <script>
        // Get game parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const gameUrl = urlParams.get('game');
        const gameTitle = urlParams.get('title');

        // Set game title and iframe source
        if (gameTitle) {
            document.getElementById('game-title').textContent = gameTitle;
        }
        if (gameUrl) {
            document.getElementById('game-frame').src = gameUrl;
        }
    </script>
</body>
</html>
