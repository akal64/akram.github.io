<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play HTML5 Games - Akram Albayhaqi's Portfolio">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D1D6DVEZ63"></script>
    <script> 
    window.dataLayer = window.dataLayer || []; 
    function gtag(){dataLayer.push(arguments);} 
    gtag('js', new Date()); 

    gtag('config', 'G-D1D6DVEZ63');

    <title>Games - Akram Albayhaqi Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" media="print" onload="this.media='all'">
    <style>
        .game-container {
            width: 100%;
            height: 120vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            padding: 2rem;
        }

        .game-frame {
            width: 100%;
            max-width: 1280px;
            height: 720px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(var(--primary-color-rgb), 0.2);
        }

        .game-header {
            width: 100%;
            max-width: 1280px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .game-title {
            color: var(--primary-color);
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(var(--primary-color-rgb), 0.3);
        }

        .back-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .back-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            transform: translateX(-5px);
        }

        .back-btn i {
            margin-right: 0.5rem;
        }

        .error-message {
            color: var(--primary-color);
            text-align: center;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            margin: 2rem;
            display: none;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .control-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .game-frame.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            border-radius: 0;
        }

        @media (max-width: 768px) {
            .game-frame.fullscreen {
                width: 100vw;
                height: 100vh;
            }
        }

        .download-btn {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .download-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .download-btn i {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <main class="game-container">
        <div class="game-header">
            <h1 class="game-title" id="game-title">Game Title</h1>
            <div class="controls">
                <button id="fullscreen-btn" class="control-btn" aria-label="Toggle Fullscreen">
                    <i class="fas fa-expand"></i> Fullscreen
                </button>
                <button id="rotate-btn" class="control-btn" aria-label="Toggle Screen Rotation">
                    <i class="fas fa-sync"></i> Rotate
                </button>
                <a id="download-btn" href="#" class="download-btn" aria-label="Download Game">
                    <i class="fas fa-download"></i> Download
                </a>
                <a href="index.html" class="back-btn" aria-label="Back to Portfolio">
                    <i class="fas fa-arrow-left"></i> Back to Portfolio
                </a>
            </div>
        </div>
        <div id="error-message" class="error-message">
            <h2>Game Loading Error</h2>
            <p>The game could not be loaded. Please check if the game files are properly uploaded to the repository.</p>
        </div>
        <iframe id="game-frame" class="game-frame" title="Game Frame" loading="lazy" allowfullscreen></iframe>
    </main>

    <script>
        // Get game parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const gameUrl = urlParams.get('game');
        const gameTitle = urlParams.get('title');
        const gameFrame = document.getElementById('game-frame');
        const errorMessage = document.getElementById('error-message');

        // Set game title
        if (gameTitle) {
            document.getElementById('game-title').textContent = gameTitle;
        }

        // Load game with error handling
        if (gameUrl) {
            gameFrame.onerror = () => {
                gameFrame.style.display = 'none';
                errorMessage.style.display = 'block';
            };

            gameFrame.onload = () => {
                gameFrame.style.display = 'block';
                errorMessage.style.display = 'none';
            };

            // Set the game source
            gameFrame.src = gameUrl;
        } else {
            gameFrame.style.display = 'none';
            errorMessage.style.display = 'block';
            errorMessage.querySelector('p').textContent = 'No game URL provided.';
        }

        // Fullscreen functionality
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const rotateBtn = document.getElementById('rotate-btn');

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                gameFrame.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
                gameFrame.classList.add('fullscreen');
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i> Exit Fullscreen';
            } else {
                document.exitFullscreen();
                gameFrame.classList.remove('fullscreen');
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i> Fullscreen';
            }
        });

        // Screen rotation functionality
        let isRotated = false;
        rotateBtn.addEventListener('click', async () => {
            try {
                if (!isRotated) {
                    await screen.orientation.lock('landscape');
                    rotateBtn.innerHTML = '<i class="fas fa-sync"></i> Unlock Rotation';
                } else {
                    await screen.orientation.unlock();
                    rotateBtn.innerHTML = '<i class="fas fa-sync"></i> Rotate';
                }
                isRotated = !isRotated;
            } catch (err) {
                console.error(`Error attempting to change screen orientation: ${err.message}`);
            }
        });

        // Handle fullscreen change events
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                gameFrame.classList.remove('fullscreen');
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i> Fullscreen';
            }
        });

        // Download functionality
        const downloadBtn = document.getElementById('download-btn');

        // Set download link based on game title
        if (gameTitle === 'Cell Chronicles') {
            downloadBtn.href = 'https://akirafuna64.itch.io/cell-chronicles';
            downloadBtn.target = '_blank';
            downloadBtn.rel = 'noopener noreferrer';
            downloadBtn.innerHTML = '<i class="fas fa-external-link-alt"></i> Download on itch.io';
        } else if (gameTitle === 'Mysterious Temple Treasure') {
            downloadBtn.href = 'https://akirafuna64.itch.io/the-mysterious-temple-treasure';
            downloadBtn.target = '_blank';
            downloadBtn.rel = 'noopener noreferrer';
            downloadBtn.innerHTML = '<i class="fas fa-external-link-alt"></i> Download on itch.io';
        } else {
            downloadBtn.style.display = 'none';
        }
    </script>
</body>
</html>
